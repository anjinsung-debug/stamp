<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#E9F0EC">
<meta name="color-scheme" content="light">
<title>STAMP 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cover: #1B2A4A; --gold: #C2A25A; --page: #E9F0EC; --paper: #F8FBF9;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); /* 움직임 공통 곡선: 빠르게 시작해 부드럽게 멈춤 */
    --ink: #22303F; --muted: #5E6B78; --line: #C3D2CB;
    --violet: #5B3FA8; --green: #2E7D4F; --red: #C0323A; --amber: #9A5B12; --blue: #2D5B9A;
  }
  * { box-sizing: border-box; }
  /* 휴대폰: 탭할 때 회색 번쩍임, 가로 회전 시 글자 확대 막기 */
  html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; scroll-padding: 16px 0; }
  main:focus { outline: none; }
  .mark { margin: 0; }
  button { touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  body {
    margin: 0; color: var(--ink);
    font: 15px/1.6 "IBM Plex Sans KR", system-ui, "Malgun Gothic", sans-serif;
    background-color: var(--page);
    /* 사증 면 보안 무늬 */
    background-image:
      repeating-radial-gradient(circle at 0 0, transparent 0 18px, rgb(46 125 79 / .07) 18px 19px),
      repeating-radial-gradient(circle at 100% 100%, transparent 0 18px, rgb(91 63 168 / .06) 18px 19px);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { text-wrap: balance; }
  p, li, .note { text-wrap: pretty; }
  .dday b, .field b, .calls b, .progress, .slot { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 520px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
  :focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .mark { font-weight: 700; font-size: 20px; letter-spacing: .18em; color: var(--cover); }
  .mark span { display: block; font-size: 12px; letter-spacing: 0; font-weight: 400; color: var(--muted); }
  .mark .home { all: unset; display: block; cursor: pointer; border-radius: 6px; transition: scale 120ms var(--ease-out); }
  .mark .home:active { scale: .97; }
  .mark .home:focus-visible { outline: 3px solid var(--violet); outline-offset: 4px; }
  h2 { font-size: 17px; margin: 24px 0 10px; }
  p { margin: 0 0 10px; }
  .muted { color: var(--muted); font-size: 13px; }

  button { font: inherit; border: 0; border-radius: 6px; padding: 11px 16px; min-height: 44px; background: var(--cover); color: #fff; cursor: pointer; transition: scale 120ms var(--ease-out), border-color 150ms ease; }
  button:active:not(:disabled) { scale: .97; }
  button.ghost { background: transparent; color: var(--cover); border: 1px solid var(--line); padding: 8px 12px; }
  button.link { background: none; color: var(--blue); padding: 0 4px; text-decoration: underline; text-underline-offset: 3px; display: inline-flex; align-items: center; }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .full { width: 100%; }
  /* 16px 미만이면 iOS가 입력할 때 화면을 확대함 */
  input, select { font: inherit; font-size: 16px; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); }
  label { display: block; margin: 12px 0 4px; font-size: 13px; color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }

  /* 종이 서식 */
  /* 종이가 살짝 떠 있는 느낌: 테두리 대신 겹친 투명 그림자 */
  .sheet, .datapage, .visa { box-shadow: 0 0 0 1px rgb(27 42 74 / .09), 0 1px 2px rgb(27 42 74 / .06), 0 6px 16px rgb(27 42 74 / .05); }
  .sheet { background: var(--paper); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
  .now-tag { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: rgb(91 63 168 / .1); color: var(--violet); font-size: 12px; font-weight: 700; }
  .sample { font-size: 12px; color: var(--amber); font-weight: 500; }
  .src { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .src a { color: var(--muted); }
  .footnote { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .err { color: var(--red); font-size: 13px; margin: 6px 0 0; }
  [aria-invalid="true"] { border-color: var(--red); }

  /* 여권 표지 (시작 화면) */
  /* 표지: 금박 보안 무늬 + 안쪽 금선 테두리 (실제 여권 문양은 쓰지 않은 STAMP 자체 표지) */
  .cover { position: relative; overflow: hidden; color: var(--gold); border-radius: 14px 14px 6px 6px; padding: 52px 24px 36px; text-align: center;
    background-color: var(--cover);
    background-image:
      repeating-radial-gradient(circle at 50% 115%, transparent 0 13px, rgb(194 162 90 / .13) 13px 14px),
      repeating-radial-gradient(circle at 50% -15%, transparent 0 21px, rgb(194 162 90 / .08) 21px 22px);
    box-shadow: 0 10px 28px rgb(27 42 74 / .28); }
  .cover::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgb(194 162 90 / .45); border-radius: 10px 10px 3px 3px; pointer-events: none; }
  .emblem { width: 108px; height: 108px; margin: 0 auto 20px; border: 4px double var(--gold); border-radius: 50%; display: grid; place-items: center; font-weight: 700; letter-spacing: .22em; font-size: 15px; background: rgb(27 42 74 / .6); }
  .cover h1 { margin: 0; font-size: 30px; letter-spacing: .2em; background: linear-gradient(180deg, #EAD59C, #B08A3E); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .cover p { margin: 8px 0 0; color: #d9c79b; font-size: 14px; }

  /* 여권 정보 면 (로드맵 상단) */
  .datapage { background: #fff; border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .datapage .fields { display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; padding: 16px 16px 12px; }
  .field small { display: block; font-size: 12px; color: var(--muted); }
  .field b { font-size: 16px; font-weight: 500; }
  .dday { grid-row: span 2; align-self: center; text-align: right; color: var(--cover); }
  .dday b { display: block; font-size: 44px; line-height: 1; font-weight: 700; }
  .dday small { font-size: 13px; color: var(--muted); }
  .mrz { font-family: "IBM Plex Mono", monospace; font-size: 13px; letter-spacing: .12em; background: #f1f4f3; border-top: 1px solid var(--line); padding: 8px 16px; white-space: nowrap; overflow: hidden; color: #3d4a57; }
  .progress { font-size: 14px; color: var(--muted); margin: 8px 2px 0; }

  /* 사증 면: 도장 칸 */
  .visa { background: #fff; border-radius: 4px; padding: 16px; margin-top: 16px; }
  .slots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  /* 도장 컬렉션 머리: 모은 개수를 크게 */
  .col-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 14px; margin-bottom: 16px; border-bottom: 1px dotted var(--line); }
  .col-head h2 { margin: 0 0 4px; }
  .col-head p { margin: 0; }
  .count { flex: none; color: var(--cover); line-height: 1; text-align: right; font-variant-numeric: tabular-nums; }
  .count b { font-size: 48px; font-weight: 700; letter-spacing: -.02em; }
  .count span { font-size: 16px; color: var(--muted); margin-left: 4px; }
  /* 도장 문양: 모으기 전엔 흐릿하게, 모으면 잉크색 */
  .ico { display: block; width: 40px; height: 40px; margin: 0 auto 6px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; opacity: .35; }
  .slot.now .ico { opacity: .8; }
  .slot.done .ico { opacity: 1; stroke-width: 1.6; }
  .slot { position: relative; aspect-ratio: 1 / .82; display: grid; place-items: center; text-align: center; padding: 10px; cursor: pointer; background: none; color: var(--muted); border: 2px dashed var(--line); border-radius: 50%; font-size: 13px; line-height: 1.35; }
  .slot.shape-1 { border-radius: 12px; }
  .slot.shape-2 { border-radius: 50% / 38%; }
  .slot .no { font-size: 12px; }
  .slot .t { display: block; font-weight: 700; font-size: 15px; color: var(--ink); }
  .slot.now { border: 2px solid var(--violet); color: var(--violet); background: rgb(91 63 168 / .05); }
  .slot.now .t { color: var(--violet); }
  .slot.done { border: 4px double var(--ink-c); color: var(--ink-c); transform: rotate(var(--tilt)); background: none; mix-blend-mode: multiply; }
  .slot.done .t { color: var(--ink-c); letter-spacing: .04em; }
  @media (hover: hover) and (pointer: fine) {
    .slot:hover:not(.done) { border-color: var(--cover); }
  }

  /* 국가 정보 */
  .info dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  .info dt { color: var(--muted); font-size: 13px; }
  .info dd { margin: 0; }
  .calls { list-style: none; padding: 0; margin: 0; }
  .calls li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px dotted var(--line); }
  .calls b { font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 단계 상세 */
  .todos { list-style: none; padding: 0; margin: 12px 0; }
  .todos li { border-bottom: 1px dotted var(--line); }
  .todos label { display: flex; gap: 12px; align-items: flex-start; margin: 0; padding: 11px 0; color: var(--ink); font-size: 15px; cursor: pointer; transition: color 200ms ease; }
  .todos label:has(input:checked) { color: var(--muted); }
  /* 둥근 체크 버튼: 체크하면 초록으로 차고 살짝 튐 */
  .todos input { appearance: none; width: 22px; height: 22px; margin: 0; padding: 0; flex: none; display: grid; place-content: center; border: 2px solid var(--line); border-radius: 50%; background: #fff; cursor: pointer; transition: background-color 160ms ease, border-color 160ms ease; }
  .todos input::after { content: ""; width: 5px; height: 10px; margin-top: -2px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) scale(0); transition: transform 200ms var(--ease-out); }
  .todos input:checked { background: var(--green); border-color: var(--green); animation: check-pop 260ms var(--ease-out); }
  .todos input:checked::after { transform: rotate(45deg) scale(1); }
  @keyframes check-pop { 50% { scale: 1.15; } }
  .todos .todo-link { display: block; width: fit-content; margin-top: 2px; padding: 4px 0; font-size: 13px; color: var(--blue); }
  .todo-prog { display: flex; align-items: center; gap: 10px; margin: 16px 0 0; font-size: 13px; color: var(--muted); }
  .todo-prog .bar { flex: 1; height: 6px; border-radius: 999px; background: rgb(46 125 79 / .14); overflow: hidden; }
  .todo-prog .bar i { display: block; height: 100%; border-radius: inherit; background: var(--green); transition: width 300ms var(--ease-out); }
  details { border-top: 1px dotted var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 500; }
  .mistakes ul { margin: 6px 0 2px; padding-left: 20px; }
  /* 6단계: 물건 확인으로 가는 카드형 버튼 */
  .go-items { display: flex; align-items: center; gap: 12px; width: 100%; margin: 14px 0 12px; padding: 14px 16px; text-align: left; border-radius: 12px;
    background: linear-gradient(135deg, var(--cover), #2B3F6B); box-shadow: 0 6px 16px rgb(27 42 74 / .22); }
  .go-items .gi-ico { display: grid; place-items: center; width: 40px; height: 40px; flex: none; border-radius: 50%; background: rgb(255 255 255 / .14); }
  .go-items svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .go-items .gi-txt { flex: 1; min-width: 0; }
  .go-items b { display: block; font-size: 16px; }
  .go-items small { display: block; margin-top: 2px; font-size: 13px; color: rgb(255 255 255 / .72); }
  .go-items .gi-go { width: 20px; height: 20px; flex: none; color: var(--gold); transition: transform 160ms var(--ease-out); }
  @media (hover: hover) and (pointer: fine) { .go-items:hover .gi-go { transform: translateX(3px); } }
  /* 페이지 맨 아래 footer: 출처 보기 */
  .page-foot { margin-top: 20px; padding: 0 4px; }
  .page-foot .sources { border-top: 1px solid var(--line); padding-top: 12px; }
  .sources summary { font-size: 13px; color: var(--muted); }
  .sources .src:first-of-type { margin-top: 8px; }

  /* 사진으로 확인: 파일 입력은 숨기되 키보드 포커스는 라벨 테두리로 보여 줌 */
  .photo-btn { display: flex; justify-content: center; align-items: center; min-height: 44px; margin: 8px 0 0; border: 1px dashed var(--cover); border-radius: 6px; color: var(--cover); font-size: 15px; font-weight: 500; cursor: pointer; }
  .photo-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .photo-btn:focus-within { outline: 3px solid var(--violet); outline-offset: 2px; }
  @media (hover: hover) and (pointer: fine) { .photo-btn:hover { background: rgb(27 42 74 / .04); } }
  .photo-msg { margin: 14px 0 0; font-weight: 700; }
  .manual { margin-top: 16px; padding-top: 12px; border-top: 1px dotted var(--line); }
  .manual h3 { margin: 0; font-size: 15px; color: var(--cover); }
  .manual .note { margin-top: 14px; }
  .photo-msg + .muted { display: flex; align-items: center; gap: 6px; }
  .photo-msg + .muted .gico { width: 16px; height: 16px; }

  /* 물건 판정 */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .groups { margin-top: 12px; }
  .grp { border-top: 1px dotted var(--line); padding: 0; }
  .grp:last-child { border-bottom: 1px dotted var(--line); }
  .grp summary { display: flex; align-items: center; gap: 8px; min-height: 48px; list-style: none; font-size: 15px; font-weight: 700; color: var(--cover); }
  .grp summary::-webkit-details-marker { display: none; }
  .grp .gname { flex: 1; }
  .grp .gmeta { font-size: 12px; font-weight: 400; color: var(--muted); }
  .grp .gmeta em { font-style: normal; color: var(--red); font-weight: 700; }
  .grp .chev { width: 18px; height: 18px; flex: none; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 200ms var(--ease-out); }
  .grp[open] .chev { transform: rotate(180deg); }
  .grp .chips { margin: 0 0 14px; }
  .gico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .chips .ban { margin-left: 6px; padding: 0 5px; border: 1.5px solid currentColor; border-radius: 4px; color: var(--red); font-size: 11px; font-weight: 700; vertical-align: 1px; }
  .chips button { background: #fff; color: var(--cover); border: 1px solid var(--line); padding: 10px 14px; font-size: 14px; }
  .verdict { display: inline-block; margin: 6px 0 12px; padding: 8px 16px; border: 4px double currentColor; border-radius: 8px; font-weight: 700; font-size: 18px; transform: rotate(-2deg); transition: opacity 240ms var(--ease-out), scale 240ms var(--ease-out); }
  /* 판정 도장이 살짝 크게 나타났다가 쿵 찍히듯 자리잡음 */
  @starting-style { .verdict { opacity: 0; scale: 1.08; } }
  .s-both { color: var(--green); } .s-carry_on_only { color: var(--violet); } .s-checked_only { color: var(--amber); } .s-prohibited { color: var(--red); } .s-null { color: var(--muted); }
  .verdict small { display: block; font-size: 13px; font-weight: 500; }
  .banner { background: var(--red); color: #fff; padding: 10px 14px; border-radius: 4px; font-weight: 700; margin-bottom: 12px; }
  /* 판정 탑승권: 절취선 양끝을 반원으로 따냄 */
  .pass { background: #fff; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 0 0 1px rgb(27 42 74 / .09), 0 1px 2px rgb(27 42 74 / .06), 0 8px 20px rgb(27 42 74 / .07); }
  .pass .banner { border-radius: 0; margin: 0; }
  .pass-top { padding: 18px 18px 16px; }
  .pass-top h2 { margin: 0 0 14px; font-size: 22px; }
  .route { display: flex; align-items: center; gap: 12px; }
  .route span { font-weight: 700; font-size: 17px; color: var(--cover); line-height: 1.2; }
  .route span:last-child { text-align: right; }
  .route small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .route i { flex: 1; display: flex; align-items: center; gap: 6px; color: var(--cover); }
  .route i::before, .route i::after { content: ""; flex: 1; border-top: 2px dotted var(--line); }
  .route svg { width: 22px; height: 22px; fill: currentColor; }
  .pass-cut { position: relative; margin: 0 14px; border-top: 2px dashed var(--line); }
  .pass-cut::before, .pass-cut::after { content: ""; position: absolute; top: -11px; width: 20px; height: 20px; border-radius: 50%; background: var(--page); }
  .pass-cut::before { left: -25px; } .pass-cut::after { right: -25px; }
  .pass-stub { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: end; padding: 14px 18px 18px; }
  .pass-stub > div > small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .pass-stub .verdict { margin: 0; }
  .entry { display: inline-block; padding: 7px 10px; border-radius: 6px; font-size: 15px; }
  .e-ok { color: var(--green); background: rgb(46 125 79 / .09); }
  .e-banned { color: var(--red); background: rgb(192 50 58 / .09); }
  .e-declare { color: var(--amber); background: rgb(154 91 18 / .1); }
  .e-info { color: var(--blue); background: rgb(45 91 154 / .09); }
  .note { border-left: 4px solid var(--muted); background: #fff; padding: 10px 12px; margin: 10px 0 0; font-size: 14px; }
  .note b { display: block; margin-bottom: 2px; }
  .lv-banned { border-color: var(--red); } .lv-banned b { color: var(--red); }
  .lv-declare { border-color: var(--amber); } .lv-declare b { color: var(--amber); }
  .lv-info { border-color: var(--blue); } .lv-info b { color: var(--blue); }

  /* 가방: 챙길 것 체크리스트 */
  .checklist h3 { margin: 0 0 4px; font-size: 17px; }
  .checklist h4 { margin: 14px 0 0; font-size: 13px; color: var(--muted); font-weight: 500; }
  .checklist .count b { font-size: 36px; }
  .checklist .todos { margin: 4px 0 0; }
  .checklist .todos li { display: flex; align-items: center; gap: 8px; }
  .checklist .todos li > label { flex: 1; }
  .checklist .todos .link { flex: none; font-size: 13px; min-height: 44px; }
  .checklist .todos .del { color: var(--muted); }
  .own-add { margin-top: 16px; padding-top: 12px; border-top: 1px dotted var(--line); }
  .own-add label { margin-top: 0; }
  .own-add .row { display: flex; gap: 8px; }
  .own-add .row input { flex: 1; min-width: 0; }
  .own-add .row button { flex: none; }

  /* 가방 */
  .group h3 { font-size: 15px; margin: 0 0 6px; }
  /* 짐표: 왼쪽 색 띠(판정 잉크색) + 끈 구멍 */
  .tag { position: relative; padding-left: 50px; border-radius: 10px; --tag-c: var(--muted); }
  .tag::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 32px; background: var(--tag-c); border-radius: 10px 0 0 10px; }
  .tag::after { content: ""; position: absolute; left: 10px; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--page); box-shadow: inset 0 1px 2px rgb(0 0 0 / .25); }
  .tag h3 { color: var(--tag-c); }
  .tag li:last-child { border-bottom: 0; }
  .t-no { --tag-c: var(--red); } .t-carry_on_only { --tag-c: var(--violet); } .t-checked_only { --tag-c: var(--amber); } .t-both { --tag-c: var(--green); }
  .group ul { list-style: none; padding: 0; margin: 0; }
  .group li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dotted var(--line); }

  /* 왼쪽 위 메뉴 */
  header { justify-content: flex-start; gap: 12px; }
  .menu { position: relative; border: 0; padding: 0; } /* FAQ용 details 구분선이 메뉴에 붙지 않게 */
  .menu summary { position: relative; list-style: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--paper); color: var(--cover); border: 1px solid var(--line); cursor: pointer; transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease; }
  /* 평소에는 종이색 칸으로 화면에 녹아들고, 열렸을 때만 남색으로 */
  .menu[open] summary { background: var(--cover); color: #fff; border-color: var(--cover); }
  @media (hover: hover) and (pointer: fine) { .menu summary:hover { border-color: var(--cover); } }
  .menu summary::after { content: ""; position: absolute; inset: -4px; } /* 보이는 크기는 36px, 누르는 영역은 44px 유지 */
  .menu summary::-webkit-details-marker { display: none; }
  .menu summary svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .menu nav { position: absolute; top: 44px; left: 0; z-index: 10; min-width: 200px; display: flex; flex-direction: column; padding: 6px; background: var(--cover); border-radius: 6px; box-shadow: 0 8px 24px rgb(27 42 74 / .25); transform-origin: top left; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
  /* 메뉴는 왼쪽 위 버튼에서 펼쳐짐 */
  @starting-style { .menu[open] nav { opacity: 0; transform: translateY(-4px) scale(.97); } }
  .menu nav button { background: none; color: #d6deea; text-align: left; border-radius: 4px; }
  .menu nav button.on { color: var(--gold); font-weight: 700; box-shadow: inset 3px 0 0 var(--gold); }
  .menu nav .reset { margin-top: 6px; border-top: 1px solid rgb(255 255 255 / .15); border-radius: 0; color: #9aa7bd; font-size: 14px; }
  @media (hover: hover) and (pointer: fine) { .menu nav button:hover { background: rgb(255 255 255 / .08); } }

  /* 여행경보 바로가기 */
  .alert { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; margin-top: 8px; padding: 10px 14px; border-radius: 4px; background: #fff; color: var(--red); font-weight: 700; text-decoration: none; box-shadow: inset 0 0 0 1px rgb(192 50 58 / .35), inset 4px 0 0 var(--red); }
  .alert span { font-size: 12px; font-weight: 400; color: var(--muted); }
  .alert::after { content: "↗"; margin-left: auto; }
  @media (hover: hover) and (pointer: fine) { .alert:hover { background: rgb(192 50 58 / .05); } }

  /* 단계 이전·다음 */
  .pager { display: flex; justify-content: space-between; gap: 8px; }
  .pager button { flex: 0 1 48%; background: var(--paper); text-align: left; font-weight: 700; }
  .pager .next { text-align: right; }
  .pager small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }

  /* 인천공항 게이트 찾기 */
  .gate-where { margin: 14px 0 4px; font-size: 16px; }
  .gate-where:focus { outline: none; }
  .gmap { display: block; width: 100%; max-width: 420px; margin: 4px auto; }
  .gmap .blk path { fill: #fff; stroke: var(--line); stroke-width: 1.5; stroke-linejoin: round; }
  .gmap .blk path + path { fill: #f1f4f3; }
  .gmap .blk text { font: 500 12px "IBM Plex Sans KR", sans-serif; fill: var(--muted); text-anchor: middle; }
  .gmap .blk.on path { fill: rgb(91 63 168 / .12); stroke: var(--violet); }
  .gmap .blk.on path + path { fill: rgb(91 63 168 / .22); }
  .gmap .blk.on text { fill: var(--violet); font-weight: 700; }
  .gmap .blk.from path { stroke: var(--cover); }
  .gmap .blk.from text { fill: var(--cover); }
  .gmap .rail { stroke: var(--line); stroke-width: 3; stroke-dasharray: 5 4; fill: none; }
  .gmap .rail.on { stroke: var(--violet); }
  .gmap .rail-t { font: 400 10px "IBM Plex Sans KR", sans-serif; fill: var(--muted); text-anchor: middle; }
  .gate-steps { margin: 10px 0 0; padding-left: 22px; }
  .gate-steps li { margin: 6px 0; padding-left: 2px; }
  .gate-steps li:last-child { font-weight: 700; color: var(--violet); }
  .alert.map { color: var(--blue); box-shadow: inset 0 0 0 1px rgb(45 91 154 / .35), inset 4px 0 0 var(--blue); }

  /* 단계 안 여행 국가 정보 */
  .info { background: #fff; border-radius: 4px; padding: 12px 14px; margin: 12px 0; box-shadow: inset 0 0 0 1px var(--line); }
  .info h3 { font-size: 14px; margin: 0 0 6px; color: var(--blue); }
  .info p { margin: 0; }
  .info .note { margin-top: 8px; box-shadow: inset 0 0 0 1px var(--line); }
  .calls a { color: var(--ink); font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* 완료 도장 연출: 이 서비스에서 유일한 자동 모션 */
  .stampfx { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; background: rgb(233 240 236 / .4); }
  .stampfx div { border: 6px double var(--red); color: var(--red); font-size: 30px; font-weight: 700; letter-spacing: .1em; padding: 18px 28px; border-radius: 50%; transform: rotate(-10deg); animation: slam .45s cubic-bezier(.2, .9, .3, 1.3); text-align: center; line-height: 1.2; }
  .stampfx .ico { width: 52px; height: 52px; opacity: 1; stroke-width: 1.6; }
  .stampfx small { display: block; font-size: 14px; letter-spacing: 0; font-weight: 500; }
  @keyframes slam { from { transform: rotate(-10deg) scale(2.4); opacity: 0; } to { transform: rotate(-10deg) scale(1); opacity: 1; } }
  /* 화면 전환: 이전 화면은 빠르게 사라지고 새 화면은 살짝 올라오며 나타남 */
  /* 머리글(로고·메뉴)은 전환 효과 없이 바로 제자리에: 미끄러지거나 흐려지지 않게 */
  header { view-transition-name: header; }
  ::view-transition-group(header), ::view-transition-new(header) { animation: none; }
  ::view-transition-old(header) { display: none; }
  ::view-transition-old(root) { animation: vt-out 180ms var(--ease-out) both; }
  ::view-transition-new(root) { animation: vt-in 340ms var(--ease-out) both; }
  @keyframes vt-out { to { opacity: 0; } }
  @keyframes vt-in { from { opacity: 0; transform: translateY(12px); } }
  @media (prefers-reduced-motion: reduce) {
    .stampfx div { animation: none; }
    .todos input:checked { animation: none; }
    .grp .chev { transition: none; }
    .todos input::after, .todo-prog .bar i { transition: none; }
    ::view-transition-new(root) { animation: vt-fade 240ms ease both; } /* 움직임 없이 흐려졌다 나타나기만 */
    .verdict, .menu nav { transition: opacity 160ms ease; }
    @starting-style { .verdict { scale: 1; } .menu[open] nav { transform: none; } }
  }
  @keyframes vt-fade { from { opacity: 0; } }

  /* PC: 상단 메뉴 + 2단 */
  @media (min-width: 900px) {
    .wrap { max-width: 1080px; padding: 28px 28px 48px; }
    .visa { padding: 22px; }
    .slots { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .narrow, header { max-width: 720px; margin-left: auto; margin-right: auto; } /* 로고·메뉴를 본문과 같은 폭에 맞춤 */
  }
</style>
</head>

<main class="wrap" id="app" tabindex="-1"></main>

<script src="app.js"></script>
